name: Pruebas de carga

# Se lanza a mano (gh workflow run carga.yml -f ...). Reparte los usuarios entre varias máquinas de GitHub para que la red
# de una sola no sea el cuello de botella. Ver loadtest/README.md.
on:
  workflow_dispatch:
    inputs:
      escenario:
        description: "Recorrido"
        type: choice
        options: [navegar, ver]
        default: navegar
      forma:
        description: "carga | estres | pico"
        type: choice
        options: [carga, estres, pico]
        default: carga
      usuarios:
        description: "Usuarios simultáneos en total (se reparten entre las máquinas)"
        default: "25"
      maquinas:
        description: "Máquinas (1-20; cada una sale por una IP distinta)"
        default: "1"
      meseta:
        description: "Segundos manteniendo la carga"
        default: "180"
      titulos:
        description: "Slugs de obras del motor para «ver» (separados por comas)"
        default: ""
      gobernador:
        description: "«ver»: 1 = el espectador obedece el semáforo de calidad (/carga), como el reproductor real"
        default: "0"
      colchon:
        description: "«ver»: segundos de vídeo que se bajan sin esperar (100000 = sin pausa, mide la red al máximo)"
        default: "30"

permissions:
  contents: read

concurrency:
  group: pruebas-de-carga
  cancel-in-progress: false

jobs:
  reparto:
    runs-on: ubuntu-latest
    outputs:
      maquinas: ${{ steps.lista.outputs.maquinas }}
      usuarios: ${{ steps.lista.outputs.usuarios }}
      inicio: ${{ steps.lista.outputs.inicio }}
    steps:
      - id: lista
        run: |
          n=$(( ${{ inputs.maquinas }} < 1 ? 1 : (${{ inputs.maquinas }} > 20 ? 20 : ${{ inputs.maquinas }}) ))
          echo "maquinas=[$(seq -s, 1 $n)]" >> "$GITHUB_OUTPUT"
          echo "usuarios=$(( (${{ inputs.usuarios }} + n - 1) / n ))" >> "$GITHUB_OUTPUT"
          # Hora de salida común (dentro de 3 min) para que todas las máquinas carguen a la vez aunque arranquen escalonadas.
          echo "inicio=$(( $(date +%s) + 180 ))" >> "$GITHUB_OUTPUT"

  carga:
    needs: reparto
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        maquina: ${{ fromJSON(needs.reparto.outputs.maquinas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: k6 ${{ inputs.escenario }} (${{ inputs.forma }})
        continue-on-error: true
        env:
          USUARIOS: ${{ needs.reparto.outputs.usuarios }}
          FORMA: ${{ inputs.forma }}
          MESETA: ${{ inputs.meseta }}
          TITULOS: ${{ inputs.titulos }}
          COLCHON: ${{ inputs.colchon }}
          INICIO: ${{ needs.reparto.outputs.inicio }}
          GOBERNADOR: ${{ inputs.gobernador }}
        run: k6 run --quiet --summary-export "resumen-${{ matrix.maquina }}.json" "loadtest/${{ inputs.escenario }}.js"
      - uses: actions/upload-artifact@v4
        with:
          name: resumen-${{ matrix.maquina }}
          path: resumen-${{ matrix.maquina }}.json
